<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E5EFF">
  <meta name="description" content="Try the OnDemand customer and technician apps in your browser.">
  <title>OnDemand demo</title>
  <link rel="icon" type="image/png" href="customer/favicon.png">
  <style>
    :root {
      --brand: #1E5EFF;
      --brand-soft: #E8EFFF;
      --ink: #14161F;
      --muted: #5C6273;
      --line: #E3E6EE;
      --page: #F5F7FB;
      --card: #FFFFFF;
    }
    /* Dark follows the device until the visitor picks one with the header button (data-theme). */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --brand-soft: #1B2747; --ink: #ECEEF4; --muted: #A2A8B8; --line: #2A2F3D; --page: #0F1218; --card: #171B24; }
    }
    :root[data-theme="dark"] { --brand-soft: #1B2747; --ink: #ECEEF4; --muted: #A2A8B8; --line: #2A2F3D; --page: #0F1218; --card: #171B24; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--page);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    [dir="rtl"] body { font-family: Tahoma, "Segoe UI", system-ui, sans-serif; }
    a { color: var(--brand); }
    button { font: inherit; cursor: pointer; }

    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card);
    }
    header img { width: 36px; height: 36px; border-radius: 9px; }
    header h1 { font-size: 18px; margin: 0; }
    header .spacer { flex: 1; }
    .ghost { background: none; border: 1px solid var(--line); color: var(--ink); padding: 6px 14px; border-radius: 8px; }
    .ghost:hover { border-color: var(--brand); color: var(--brand); }
    .ghost.icon { padding: 6px 8px; line-height: 0; }
    .ghost.icon svg { width: 20px; height: 20px; fill: currentColor; }

    main { display: flex; gap: 32px; padding: 24px; justify-content: center; align-items: flex-start; }

    .guide { width: 300px; flex: none; }
    .guide h2 { font-size: 16px; margin: 0 0 4px; }
    .guide p { color: var(--muted); margin: 0 0 14px; }
    .guide ol { margin: 0; padding-inline-start: 20px; }
    .guide li { margin-bottom: 10px; }
    .guide li b { color: var(--ink); }
    .code { font: 600 14px ui-monospace, Menlo, monospace; background: var(--brand-soft); color: var(--brand); padding: 1px 6px; border-radius: 6px; }
    .note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
    .credit { font-size: 12px; color: var(--muted); margin-top: 12px; }

    .phones { display: flex; gap: 28px; }
    .phone { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .phone .label { font-weight: 600; }
    .phone .label small { display: block; text-align: center; font-weight: 400; color: var(--muted); }
    .frame {
      /* The 390 x 820 screen plus the 12px bezel on every side. */
      width: calc(414px * var(--scale)); height: calc(844px * var(--scale)); overflow: hidden;
      border-radius: calc(48px * var(--scale)); padding: calc(12px * var(--scale));
      background: #0B0D12; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(20, 30, 60, .18);
    }
    .frame iframe {
      width: 390px; height: 820px; border: 0; border-radius: 36px; background: var(--brand);
      transform: scale(var(--scale)); transform-origin: top left;
    }
    [dir="rtl"] .frame iframe { transform-origin: top right; }

    /* Phones and narrow windows: pick an app and open it full screen. */
    .choose { display: none; padding: 20px 16px 32px; max-width: 520px; margin: 0 auto; }
    .choose a.app {
      display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 12px; text-decoration: none;
      color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    }
    .choose a.app img { width: 56px; height: 56px; border-radius: 14px; }
    .choose a.app b { display: block; font-size: 16px; }
    .choose a.app span { color: var(--muted); font-size: 14px; }
    .choose .guide { width: auto; margin-top: 20px; }

    @media (max-width: 1080px) { .guide.side { display: none; } }
    @media (max-width: 820px) {
      main { display: none; }
      .choose { display: block; }
      header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="customer/icons/Icon-192.png" alt="">
    <h1 data-en="OnDemand" data-ar="أون ديماند">OnDemand</h1>
    <span class="spacer"></span>
    <button class="ghost icon" id="theme" type="button"></button>
    <button class="ghost" id="lang">عربي</button>
    <button class="ghost" id="reset" data-en="Start over" data-ar="البدء من جديد">Start over</button>
  </header>

  <main>
    <section class="guide side" id="guide"></section>
    <div class="phones">
      <div class="phone">
        <div class="label"><span data-en="Customer app" data-ar="تطبيق العميل">Customer app</span>
          <small data-en="Signed in as Sara" data-ar="باسم سارة">Signed in as Sara</small></div>
        <div class="frame"><iframe id="customer" title="Customer app" allow="clipboard-write"></iframe></div>
      </div>
      <div class="phone">
        <div class="label"><span data-en="Technician app" data-ar="تطبيق الفني">Technician app</span>
          <small data-en="Signed in as Ali, AC technician" data-ar="باسم علي، فني تكييف">Signed in as Ali, AC technician</small></div>
        <div class="frame"><iframe id="provider" title="Technician app" allow="clipboard-write"></iframe></div>
      </div>
    </div>
  </main>

  <section class="choose">
    <a class="app" href="customer/">
      <img src="customer/icons/Icon-192.png" alt="">
      <div><b data-en="Customer app" data-ar="تطبيق العميل">Customer app</b>
        <span data-en="Book home and car services" data-ar="اطلب خدمات المنزل والسيارة">Book home and car services</span></div>
    </a>
    <a class="app" href="provider/">
      <img src="provider/icons/Icon-192.png" alt="">
      <div><b data-en="Technician app" data-ar="تطبيق الفني">Technician app</b>
        <span data-en="Accept jobs and get paid" data-ar="اقبل الطلبات واستلم أرباحك">Accept jobs and get paid</span></div>
    </a>
    <section class="guide" id="guide-mobile"></section>
  </section>

  <template id="guide-en">
    <h2>Try a full booking</h2>
    <p>Sara books a visit in the customer app; Ali gets it in the technician app.</p>
    <ol>
      <li>In the <b>customer app</b>, tap <b>Schedule</b>, pick <b>Split AC maintenance and cleaning</b>, choose <b>علي للتكييف</b> (Ali), a time and <b>cash</b>.</li>
      <li>In the <b>technician app</b>, open the offer and <b>accept</b> it.</li>
      <li>Tap <b>On my way</b>. The customer sees the arrival time and a 4-digit <b>start code</b>.</li>
      <li>Enter the code to <b>start</b>, then <b>complete</b> the job and confirm the cash.</li>
      <li><b>Rate</b> each other, and add a <b>tip</b> from the customer app. Both show in Ali's <b>Earnings</b>.</li>
    </ol>
    <p class="note">Also try an <b>Urgent visit</b>, search, favourites, booking history, loyalty points, chat, support and
      the help assistant. On a phone, open an app and use <b>Add to Home Screen</b> to get an app icon; signing in takes
      any mobile number (05…) and the code <span class="code">141988</span>.</p>
    <p class="credit">Photos from Pexels; icons from Google's Material Icons (CC BY 4.0).</p>
  </template>
  <template id="guide-ar">
    <h2>جرّب طلباً كاملاً</h2>
    <p>تحجز سارة زيارة من تطبيق العميل، ويستلمها علي في تطبيق الفني.</p>
    <ol>
      <li>في <b>تطبيق العميل</b> اضغط <b>موعد مجدول</b> واختر <b>صيانة وتنظيف مكيف سبليت</b>، ثم <b>علي للتكييف</b> وموعداً والدفع <b>نقداً</b>.</li>
      <li>في <b>تطبيق الفني</b> افتح العرض و<b>اقبله</b>.</li>
      <li>اضغط <b>في الطريق</b>، فيرى العميل وقت الوصول و<b>رمز البدء</b> المكوّن من 4 أرقام.</li>
      <li>أدخل الرمز لـ<b>بدء</b> العمل، ثم <b>أنهِ</b> الطلب وأكّد استلام المبلغ.</li>
      <li><b>قيّما</b> بعضكما، وأضف <b>إكرامية</b> من تطبيق العميل، ويظهر الاثنان في <b>أرباح</b> علي.</li>
    </ol>
    <p class="note">جرّب أيضاً <b>الزيارة العاجلة</b> والبحث والمفضلة وسجل الطلبات ونقاط الولاء والمحادثة والدعم والمساعد. على
      الجوال افتح أحد التطبيقين واختر <b>إضافة إلى الشاشة الرئيسية</b> ليظهر كأيقونة تطبيق، والدخول بأي رقم جوال (05…)
      والرمز <span class="code">141988</span>.</p>
    <p class="credit">الصور من Pexels، والأيقونات من أيقونات Material من Google (رخصة CC BY 4.0).</p>
  </template>

  <script>
    (function () {
      // Starts every key this demo keeps in the browser; a brand demo (tool/brand.py) has its own, matching the apps'
      // Brand.storagePrefix, so it can share a site with the main demo. A brand may also start in a set theme.
      var ns = 'ondemand';
      var defaultTheme = null;
      var lang = 'en';
      try { lang = localStorage.getItem(ns + '.demo.page.lang') || (navigator.language || '').slice(0, 2); } catch (e) {}
      if (lang !== 'ar') lang = 'en';

      function apply() {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.dataset[lang]; });
        document.getElementById('lang').textContent = lang === 'ar' ? 'English' : 'عربي';
        var guide = document.getElementById('guide-' + lang).innerHTML;
        document.getElementById('guide').innerHTML = guide;
        document.getElementById('guide-mobile').innerHTML = guide;
        applyTheme();
      }

      // Light or dark for the page and both apps: the apps read the saved choice when they start and follow the
      // channel's {"theme": ...} messages while open (followDemoTheme in packages/core).
      var themeKey = ns + '.demo.page.theme';
      var theme = null;
      try { theme = localStorage.getItem(themeKey); } catch (e) {}
      if (!theme && defaultTheme) {
        theme = defaultTheme;
        try { localStorage.setItem(themeKey, theme); } catch (e) {}
      }
      var deviceDark = window.matchMedia('(prefers-color-scheme: dark)');
      var channel = 'BroadcastChannel' in window ? new BroadcastChannel(ns + '-demo') : null;
      var icons = {
        sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg>',
        moon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.3 2a9.5 9.5 0 1 0 9.7 11.6A7.5 7.5 0 0 1 12.3 2z"/></svg>'
      };

      function isDark() { return theme ? theme === 'dark' : deviceDark.matches; }

      function applyTheme() {
        if (theme) document.documentElement.dataset.theme = theme;
        else delete document.documentElement.dataset.theme;
        var button = document.getElementById('theme');
        button.innerHTML = isDark() ? icons.sun : icons.moon;
        var label = isDark() ? (lang === 'ar' ? 'الوضع الفاتح' : 'Light mode') : (lang === 'ar' ? 'الوضع الداكن' : 'Dark mode');
        button.title = label;
        button.setAttribute('aria-label', label);
      }

      document.getElementById('theme').addEventListener('click', function () {
        theme = isDark() ? 'light' : 'dark';
        try { localStorage.setItem(themeKey, theme); } catch (e) {}
        if (channel) channel.postMessage(JSON.stringify({ theme: theme }));
        applyTheme();
      });
      deviceDark.addEventListener('change', applyTheme);

      // Fit both phones in the window's height.
      function fit() {
        var scale = Math.max(0.55, Math.min(1, (window.innerHeight - 150) / 844));
        document.documentElement.style.setProperty('--scale', scale.toFixed(3));
      }

      // In a frame the apps start in the page's language, already signed in (startInDemoFrame in packages/core).
      function frameUrl(app) { return app + '/?frame=1&lang=' + lang; }

      function load() {
        if (window.innerWidth <= 820) return;
        ['customer', 'provider'].forEach(function (app) {
          var frame = document.getElementById(app);
          if (!frame.getAttribute('src')) frame.src = frameUrl(app);
        });
      }

      document.getElementById('lang').addEventListener('click', function () {
        lang = lang === 'ar' ? 'en' : 'ar';
        try { localStorage.setItem(ns + '.demo.page.lang', lang); } catch (e) {}
        if (channel) channel.postMessage(JSON.stringify({ lang: lang }));
        apply();
      });

      // Starts over: the sample data and both apps' saved state (the page's own language and theme stay).
      document.getElementById('reset').addEventListener('click', function () {
        var message = lang === 'ar' ? 'إعادة البيانات التجريبية لحالتها الأولى؟' : 'Put the sample data back the way it started?';
        if (!confirm(message)) return;
        try {
          Object.keys(localStorage).forEach(function (key) { if (key.indexOf(ns + '.') === 0 && key.indexOf(ns + '.demo.page.') !== 0) localStorage.removeItem(key); });
        } catch (e) {}
        ['customer', 'provider'].forEach(function (app) {
          var frame = document.getElementById(app);
          if (frame.getAttribute('src')) frame.src = frameUrl(app);
        });
      });

      window.addEventListener('resize', function () { fit(); load(); });
      apply();
      fit();
      load();
    })();
  </script>
</body>
</html>
